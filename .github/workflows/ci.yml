name: ci

# One pipeline, verify -> deploy. The verify jobs run in parallel on every push and pull request;
# deploy waits for them and publishes dist/ from main only.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC — external links only
  workflow_dispatch:

permissions:
  contents: read

env:
  LEFTHOOK: "0" # no git hooks during bun install in CI

jobs:
  check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # Format, build, html-validate on dist/, stylelint, sitemap drift guard, internal links.
      - run: bun run check
      - run: bun run audit
      - run: bun run lighthouse
      # Hidden files too, so /.well-known/security.txt and /.nojekyll are served.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          include-hidden-files: true

  external-links:
    # External links are flaky -> non-blocking, weekly schedule + on demand.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run links:external

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
