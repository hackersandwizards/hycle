# Git hooks. Auto-format at commit time; run the full check before push.
# Prettier and Stylelint honour .prettierignore, so public/versions/ is never touched.

pre-commit:
  parallel: false
  jobs:
    - name: prettier
      glob: "*.{astro,html,css,js,mjs,ts,json,md,yml,yaml}"
      run: bunx prettier --write {staged_files}
      stage_fixed: true
    - name: stylelint
      glob: "*.css"
      run: bunx stylelint --fix {staged_files}
      stage_fixed: true

pre-push:
  jobs:
    - name: check
      run: bun run check
