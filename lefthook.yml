# Git hooks. Scan for secrets, auto-format and lint staged code before committing.
# Prettier skips public/versions/ through .prettierignore; Stylelint only ever sees public/style.css.

pre-commit:
  parallel: false
  jobs:
    # A missing gitleaks fails the commit (exit 127) rather than skipping the scan.
    - name: gitleaks
      run: gitleaks git --pre-commit --staged --redact --verbose --no-banner --log-level warn
    - name: prettier
      glob: "*.{astro,html,css,js,mjs,ts,json,md,yml,yaml}"
      run: bun run prettier --write {staged_files}
      stage_fixed: true
    - name: stylelint
      glob: "*.css"
      run: bun run stylelint --fix {staged_files}
      stage_fixed: true
    - name: lint-code
      run: bun run lint:staged

pre-push:
  jobs:
    - script: check.sh
      runner: sh
      use_stdin: true
