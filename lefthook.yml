# Git hooks. Scan for secrets and auto-format at commit time; run the full check before push.
# Prettier skips public/versions/ through .prettierignore; Stylelint only ever sees public/style.css.

pre-commit:
  parallel: false
  jobs:
    # A missing gitleaks fails the commit (exit 127) rather than skipping the scan.
    - name: gitleaks
      run: gitleaks git --pre-commit --staged --redact --verbose --no-banner --log-level warn
    - name: prettier
      glob: "*.{astro,html,css,js,mjs,ts,json,md,yml,yaml}"
      run: bunx prettier --write {staged_files}
      stage_fixed: true
    - name: stylelint
      glob: "*.css"
      run: bunx stylelint --fix {staged_files}
      stage_fixed: true

pre-push:
  jobs:
    - name: check
      run: bun run check
